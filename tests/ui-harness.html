<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UI harness - Slime Monsters from Outer Space</title>
    <style>
      /* Same @font-face as index.html; the harness is served by the Vite dev server from the
         project root, so the font URL is root-absolute. */
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/assets/fonts/PressStart2P-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      #game canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .font-preload {
        position: absolute;
        left: -9999px;
        top: -9999px;
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <span class="font-preload" aria-hidden="true">SLIME</span>
    <script type="module" src="/src/dev/ui-harness.js"></script>
  </body>
</html>
